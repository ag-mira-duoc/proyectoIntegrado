{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}{{ form_title }} - NUAM{% endblock %}
{% block content %}
<div class="d-flex justify-content-between pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">{{ form_title }}</h1>
    <a href="{% url 'corredoras:listado' %}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Volver</a>
</div>
<form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Guardar</button>
</form>
{% endblock %}
