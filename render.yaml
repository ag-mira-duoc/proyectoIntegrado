# ==============================================================================
# CONFIGURACIÓN DE RENDER PARA PROYECTO NUAM
# ==============================================================================
#
# Este archivo define la infraestructura completa del proyecto en Render:
# - Web Service (Django + Gunicorn)
# - PostgreSQL Database
# - Redis (para Celery y caché)
# - Worker Service (Celery para OCR)
#
# INSTRUCCIONES:
# 1. Conectar repositorio GitHub a Render
# 2. Render detectará automáticamente este archivo
# 3. Configurar variables de entorno en el dashboard
# 4. Deploy automático en cada push a main
#
# ==============================================================================

# ==============================================================================
# SERVICIOS
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # WEB SERVICE - Django Application
  # ----------------------------------------------------------------------------
  - type: web
    name: nuam-web
    runtime: python
    plan: free  # Cambiar a 'standard' o 'pro' para producción
    region: oregon  # Cambiar según necesidad (oregon, frankfurt, singapore)

    # Build
    buildCommand: |
      pip install --upgrade pip &&
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput

    # Start
    startCommand: |
      gunicorn nuam_config.wsgi:application --bind 0.0.0.0:$PORT --workers 4 --threads 2 --timeout 120

    # Health check
    healthCheckPath: /

    # Autoscaling (solo en planes Pro)
    # autoDeploy: true
    # numInstances: 1

    # Environment variables
    envVars:
      # Django
      - key: PYTHON_VERSION
        value: 3.11.0

      - key: SECRET_KEY
        generateValue: true  # Render genera automáticamente

      - key: DEBUG
        value: false

      - key: ALLOWED_HOSTS
        sync: false  # Configurar manualmente en dashboard

      - key: DJANGO_SETTINGS_MODULE
        value: nuam_config.settings

      # Database (vinculada automáticamente)
      - key: DATABASE_URL
        fromDatabase:
          name: nuam-postgres
          property: connectionString

      # Redis (vinculado automáticamente)
      - key: REDIS_URL
        fromService:
          type: redis
          name: nuam-redis
          property: connectionString

      # Firebase
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false  # Configurar manualmente (JSON completo)

      - key: FIREBASE_STORAGE_BUCKET
        value: nuam-documentos.appspot.com

      # Email (configurar manualmente)
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend

      - key: EMAIL_HOST
        sync: false

      - key: EMAIL_PORT
        value: 587

      - key: EMAIL_USE_TLS
        value: true

      - key: EMAIL_HOST_USER
        sync: false

      - key: EMAIL_HOST_PASSWORD
        sync: false

      - key: DEFAULT_FROM_EMAIL
        value: noreply@nuam.cl

      # CORS
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # Configurar según frontend

      # Cifrado
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true

      # Tesseract
      - key: TESSERACT_CMD
        value: /usr/bin/tesseract

  # ----------------------------------------------------------------------------
  # CELERY WORKER - Procesamiento asíncrono (OCR, tareas pesadas)
  # ----------------------------------------------------------------------------
  - type: worker
    name: nuam-celery-worker
    runtime: python
    plan: free
    region: oregon

    # Build (mismo que web service)
    buildCommand: |
      pip install --upgrade pip &&
      pip install -r requirements.txt

    # Start Celery Worker
    startCommand: |
      celery -A nuam_config worker --loglevel=info --concurrency=2 --max-tasks-per-child=100

    # Environment variables (heredadas del web service)
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

      - key: SECRET_KEY
        fromService:
          type: web
          name: nuam-web
          envVarKey: SECRET_KEY

      - key: DATABASE_URL
        fromDatabase:
          name: nuam-postgres
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: redis
          name: nuam-redis
          property: connectionString

      - key: FIREBASE_CREDENTIALS_JSON
        sync: false

      - key: FIREBASE_STORAGE_BUCKET
        value: nuam-documentos.appspot.com

      - key: TESSERACT_CMD
        value: /usr/bin/tesseract

      - key: DEBUG
        value: false

  # ----------------------------------------------------------------------------
  # CELERY BEAT - Tareas programadas
  # ----------------------------------------------------------------------------
  - type: worker
    name: nuam-celery-beat
    runtime: python
    plan: free
    region: oregon

    buildCommand: |
      pip install --upgrade pip &&
      pip install -r requirements.txt

    # Start Celery Beat
    startCommand: |
      celery -A nuam_config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

      - key: SECRET_KEY
        fromService:
          type: web
          name: nuam-web
          envVarKey: SECRET_KEY

      - key: DATABASE_URL
        fromDatabase:
          name: nuam-postgres
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: redis
          name: nuam-redis
          property: connectionString

      - key: DEBUG
        value: false


# ==============================================================================
# DATABASES
# ==============================================================================

databases:
  # ----------------------------------------------------------------------------
  # POSTGRESQL - Base de datos principal
  # ----------------------------------------------------------------------------
  - name: nuam-postgres
    databaseName: nuam_production
    user: nuam_user
    plan: free  # Cambiar a 'standard' o 'pro' para producción
    region: oregon

    # PostgreSQL version
    # Render usa PostgreSQL 15+ por defecto

    # Backups automáticos (solo en planes pagos)
    # ipAllowList: []  # Configurar IPs permitidas si es necesario


# ==============================================================================
# REDIS (para Celery y caché)
# ==============================================================================

# NOTA: Redis se debe crear manualmente en Render Dashboard
# No está disponible en render.yaml actualmente
#
# Pasos:
# 1. Dashboard → New → Redis
# 2. Nombre: nuam-redis
# 3. Plan: Starter (gratuito)
# 4. Vincular a web service y workers


# ==============================================================================
# NATIVE ENVIRONMENTS (Paquetes del sistema)
# ==============================================================================

# Render instala automáticamente algunos paquetes comunes.
# Para Tesseract OCR, agregar en Build Command si es necesario:
#
# buildCommand: |
#   apt-get update && apt-get install -y tesseract-ocr tesseract-ocr-spa poppler-utils &&
#   pip install --upgrade pip &&
#   pip install -r requirements.txt &&
#   python manage.py collectstatic --noinput &&
#   python manage.py migrate --noinput


# ==============================================================================
# NOTAS DE DEPLOYMENT
# ==============================================================================

# 1. ANTES DEL PRIMER DEPLOY:
#    - Crear repositorio GitHub con el código
#    - Configurar variables de entorno sensibles en Render Dashboard
#    - Crear archivo .env.example (no .env) en el repo
#
# 2. VARIABLES DE ENTORNO A CONFIGURAR MANUALMENTE:
#    - ALLOWED_HOSTS (ej: nuam.onrender.com,www.nuam.cl)
#    - FIREBASE_CREDENTIALS_JSON (JSON completo del archivo de credenciales)
#    - EMAIL_HOST_USER
#    - EMAIL_HOST_PASSWORD
#    - CORS_ALLOWED_ORIGINS (si se usa frontend separado)
#
# 3. CREAR REDIS:
#    - Ir a Render Dashboard → New → Redis
#    - Nombre: nuam-redis
#    - Plan: Starter (512 MB RAM gratuito)
#    - Vincular a los servicios web y workers
#
# 4. DESPUÉS DEL DEPLOY:
#    - Crear superusuario: python manage.py createsuperuser (via Shell)
#    - Crear grupos de RBAC: Administradores, Analistas, Auditores
#    - Verificar acceso al admin: https://tu-app.onrender.com/admin/
#
# 5. COMANDOS ÚTILES EN SHELL DE RENDER:
#    python manage.py createsuperuser
#    python manage.py shell
#    python manage.py migrate
#    python manage.py collectstatic
#
# 6. LOGS:
#    - Ver logs en Render Dashboard → Tu servicio → Logs
#    - Filtrar por servicio (web, worker, beat)
#
# 7. CUSTOM DOMAIN:
#    - Render Dashboard → Settings → Custom Domain
#    - Agregar CNAME en tu proveedor DNS: CNAME -> tu-app.onrender.com
#
# 8. SSL/TLS:
#    - Render provee SSL gratuito automáticamente
#    - Se activa al agregar custom domain
#
# 9. ESCALABILIDAD:
#    - Plan Starter: 1 instancia, 512 MB RAM
#    - Plan Standard: Múltiples instancias, autoscaling
#    - Plan Pro: Mayor capacidad, SLA 99.95%
#
# 10. BACKUPS DE BASE DE DATOS:
#     - Plan Starter: Sin backups automáticos
#     - Plan Standard/Pro: Backups automáticos diarios
#     - Crear backups manuales: Dashboard → Database → Backups → Create Backup
#
# ==============================================================================
# COSTOS ESTIMADOS (USD/mes)
# ==============================================================================
#
# PLAN GRATUITO (desarrollo/testing):
# - Web Service (Starter): $0 (750 hrs/mes)
# - Workers: $0 (750 hrs/mes cada uno)
# - PostgreSQL (Starter): $0 (expira después de 90 días)
# - Redis (Starter): $0
# TOTAL: $0 (con limitaciones)
#
# PLAN BÁSICO (producción pequeña):
# - Web Service (Starter): $7/mes
# - Worker Celery: $7/mes
# - Worker Beat: $7/mes
# - PostgreSQL (Standard): $7/mes (1 GB)
# - Redis (Standard): $7/mes (512 MB)
# TOTAL: ~$35/mes
#
# PLAN ESTÁNDAR (producción media):
# - Web Service (Standard): $25/mes
# - Workers (Standard): $25/mes c/u ($50 total)
# - PostgreSQL (Standard): $20/mes (10 GB)
# - Redis (Standard): $15/mes (1 GB)
# TOTAL: ~$110/mes
#
# ==============================================================================
