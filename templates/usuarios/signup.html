{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="form-container">
        <h2>Registro</h2>
        <form id="signupForm">
            {% csrf_token %} 
            <input type="text" id="nombre" placeholder="Nombre" required>
            <input type="text" id="apellido" placeholder="Apellido" required>
            <input type="text" id="rut" placeholder="RUT (ej: 12345678-9)" required>
            <input type="email" id="email" placeholder="Email" required>
            
            <select id="corredora_id" name="corredora_id" required>
                <option value="">Selecciona tu Corredora *</option>
                {% for corredora in corredoras %}
                    <option value="{{ corredora.id }}">{{ corredora.nombre }}</option>
                {% endfor %}
            </select>

            <input type="password" id="password" placeholder="Contraseña" required>
            <input type="password" id="password2" placeholder="Confirmar Contraseña" required>
            <button type="submit">Crear Cuenta</button>
        </form>
        <div id="message"></div>
        <div class="links">
            <a href='/auth/login/'>¿Ya tienes cuenta? Inicia sesión</a>
            <span>|</span>
            <a href="/">Volver al inicio</a>
        </div>
    </div>

    <script>
        function getCsrfToken() {
            return document.querySelector('[name="csrfmiddlewaretoken"]').value;
        }

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const password2 = document.getElementById('password2').value;
            const messageDiv = document.getElementById('message');

            if (password !== password2) {
                messageDiv.className = 'message error';
                messageDiv.textContent = 'Las contraseñas no coinciden.';
                return;
            }
            
            // Construir el objeto de datos, incluyendo 'corredora' y 'password2'
            const data = {
                first_name: document.getElementById('nombre').value,
                last_name: document.getElementById('apellido').value,
                rut: document.getElementById('rut').value,
                email: document.getElementById('email').value,
                password: password,
                password2: password2,
                corredora: document.getElementById('corredora_id').value 
            };

            const csrfToken = getCsrfToken();
            messageDiv.innerHTML = ''; 
            
            try {
                const response = await fetch('/auth/signup/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                
                if (response.ok || response.status === 201) { 
                    messageDiv.className = 'message success';
                    messageDiv.textContent = result.message || '¡Registro exitoso! Por favor, inicia sesión.';

                    document.getElementById('signupForm').reset();
                    setTimeout(() => {
                        window.location.href = '/auth/login/';
                    }, 2000);
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.textContent = result.detail || JSON.stringify(result);
                }
            } catch (error) {
                document.getElementById('message').className = 'message error';
                document.getElementById('message').textContent = 'Error de conexión con el servidor: ' + error;
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
